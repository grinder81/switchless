# Maps each Banking77 intent to the microservice that handles it.
# Each service lists a one-line description (used by the LLM and JEV routers as the option text)
# and the intents it owns. Every one of the 77 intents must appear exactly once (enforced by tests).
#
# DRAFT: services are placeholders; the intent assignment is the next step.

services:
  cards:
    description: Physical and virtual card ordering, delivery, activation and status
    intents: []
  card_payments:
    description: Card payments, declines, merchant charges and card-payment fees
    intents: []
  atm_cash:
    description: ATM withdrawals, cash issues and ATM fees
    intents: []
  transfers:
    description: Bank transfers in and out, beneficiaries, pending or failed transfers
    intents: []
  top_up:
    description: Topping up the account by card, bank transfer, cash or cheque
    intents: []
  fx:
    description: Currency exchange, exchange rates and supported currencies
    intents: []
  security:
    description: PIN, passcode, lost or stolen cards, compromised accounts
    intents: []
  identity:
    description: Identity verification, KYC, source of funds and eligibility
    intents: []
  disputes:
    description: Refunds, disputed or unrecognised charges
    intents: []
  account:
    description: Account settings, personal details, closing the account
    intents: []
  wallets:
    description: Apple Pay, Google Pay and card linking
    intents: []
  fees:
    description: Questions about fees and charges not tied to a specific payment
    intents: []
