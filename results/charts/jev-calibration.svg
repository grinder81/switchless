"/></g><g><circle cx="472.2548319327736" cy="185.41176470588238" r="12" fill="transparent"><title>Confidence 80.0%–90.0% (n=238): stated 84.5%, right 66.4%</title></circle><circle cx="472.2548319327736" cy="185.41176470588238" r="5" fill="var(--jev)" stroke="var(--surface)" stroke-width="2" pointer-events="none"/></g><g><circle cx="561.6225730337103" cy="87.66516853932586" r="12" fill="transparent"><title>Confidence 90.0%–100.0% (n=2225): stated 98.7%, right 91.8%</title></circle><circle cx="561.6225730337103" cy="87.66516853932586" r="5" fill="var(--jev)" stroke="var(--surface)" stroke-width="2" pointer-events="none"/></g><text class="label" x="551.6225730337103" y="113.66516853932586" text-anchor="end">91.8% right when ≥90% sure</text></svg>
